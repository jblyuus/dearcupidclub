<script>

 {name:'Asegurado',color:'#D9FBC5'},

];

/* ===== Almacenamiento: IndexedDB (imágenes) — reemplazable por Cloudflare R2 ===== */

async function cargarAparienciaPublica(){
 const r=await fetch(AUTH_URL+'/rest/v1/configuracion?select=apariencia&id=eq.1&limit=1',{
  headers:{apikey:AUTH_PUBLISHABLE_KEY},cache:'no-store'});
 if(!r.ok)throw Error('No se pudo consultar la apariencia compartida ('+r.status+').');
 const rows=await r.json();const settings=rows[0]?.apariencia;
 if(!settings||typeof settings!=='object'||Array.isArray(settings)||!Object.keys(settings).length){
  T={...themeDefaults};applyTheme();return;
 }
 const clean={...themeDefaults};
 for(const [k,v] of Object.entries(settings)){
  if(!(k in clean)||typeof v!==typeof clean[k])continue;
  if(typeof v==='string'&&v.length>150)continue;
  clean[k]=v;
 }
 for(const k of Object.keys(themeColorLabels).concat(['particleColor','particleSecond','particleThird'])){
  if(!/^#[0-9a-f]{6}$/i.test(clean[k]))throw Error('La apariencia pública contiene un color inválido.');
 }
 T=clean;applyTheme();
}

async function guardarEnvioSupabase(id,fd){
 if(!await refreshAdmin()||!adminSession?.token)throw Error('Inicia sesión como administrador.');
 const nombre=String(fd.buyer||'').trim();if(!nombre)throw Error('Escribe el username del cupidito.');
 const data={nombre,paqueteria:fd.carrier||null,guia:String(fd.tracking||'').trim()||null,estado:SHIP_ST[Number(fd.status)]||SHIP_ST[0]};
 const url=AUTH_URL+'/rest/v1/envios'+(id?'?id=eq.'+encodeURIComponent(id):'');
 const r=await fetch(url,{method:id?'PATCH':'POST',headers:{apikey:AUTH_PUBLISHABLE_KEY,Authorization:'Bearer '+adminSession.token,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(data)});
 if(!r.ok)throw Error('No se pudo guardar el envío en Supabase: '+(await r.text()).slice(0,300));
 await sincronizarEnviosSupabase(true);
 if(id && !D.envios.some(x=>x.id===id))throw Error('No se encontró el envío actualizado.'); 
 if(!id && !D.envios.some(x=>x.buyer===nombre && x.carrier===(fd.carrier||'') && x.tracking===String(fd.tracking||'').trim()))throw Error('No se encontró el nuevo envío después de guardar.');

/* Borradores privados de los datos de una caja (no publicados). */
async function borradorRequest(path,options={}){
 if(!await refreshAdmin()||!adminSession?.token)throw Error('Inicia sesión como administrador para usar borradores.');
 const r=await fetch(AUTH_URL+'/rest/v1/borradores_cajas'+path,{
  ...options,headers:{apikey:AUTH_PUBLISHABLE_KEY,Authorization:'Bearer '+adminSession.token,...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})},cache:'no-store'
 });
 if(!r.ok)throw Error('Error de borradores ('+r.status+'): '+(await r.text()).slice(0,300));
 return r;
}
async function leerBorradorCompleto(id){
 const r=await borradorRequest('?select=contenido&caja_id=eq.'+encodeURIComponent(id)+'&limit=1');
 const rows=await r.json();return rows[0]?.contenido||null;
}
async function leerBorradorCaja(id){return (await leerBorradorCompleto(id))?.caja||null}
async function listarBorradoresCaja(){const r=await borradorRequest('?select=caja_id,contenido,actualizado_en&order=actualizado_en.desc');return r.json()}
async function guardarBorradorCompleto(id,contenido){
 await borradorRequest('?on_conflict=caja_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({caja_id:id,contenido,actualizado_en:new Date().toISOString()})});
}
async function guardarBorradorCaja(id,datos){
 const anterior=await leerBorradorCompleto(id)||{};
 await guardarBorradorCompleto(id,{...anterior,caja:datos});
}
async function borrarBorradorCaja(id){await borradorRequest('?caja_id=eq.'+encodeURIComponent(id),{method:'DELETE'})}
async function publicarBorradorCaja(id){
 if(!await refreshAdmin()||!adminSession?.token)throw Error('Sesión de administrador no disponible.');
 const r=await fetch(AUTH_URL+'/rest/v1/rpc/publicar_borrador_caja',{
  method:'POST',headers:{apikey:AUTH_PUBLISHABLE_KEY,Authorization:'Bearer '+adminSession.token,'Content-Type':'application/json'},
  body:JSON.stringify({p_caja_id:id}),cache:'no-store'
 });
 if(!r.ok){let message=await r.text();try{const j=JSON.parse(message);message=j.message||message}catch(e){}throw Error('No se pudo publicar: '+message.slice(0,300))}
 return r.json();
}

let draftCupiditos=[];
const normCupidito=v=>String(v||'').trim().replace(/^@/,'').toLocaleLowerCase('es');
async function cargarCupiditosParaBorradores(){
 const matches=new Map();
 const add=(nombre,plat)=>{const key=normCupidito(nombre);if(!key)return;const old=matches.get(key);if(!old)matches.set(key,{nombre:String(nombre).trim(),plat:plat||''});else if(!old.plat&&plat)old.plat=plat};
 (D.prods||[]).forEach(p=>add(p.buyer,p.plat));
 try{
  const r=await fetch(AUTH_URL+'/rest/v1/cupiditos?select=nombre,alias&limit=1000',{headers:{apikey:AUTH_PUBLISHABLE_KEY,Authorization:'Bearer '+adminSession.token}});
  if(r.ok)(await r.json()).forEach(c=>add(c.alias||c.nombre,''));
 }catch(e){console.warn('No se pudieron consultar los cupiditos registrados',e)}
 try{
  const borradores=await listarBorradoresCaja();
  borradores.forEach(b=>(b.contenido?.productos||[]).forEach(p=>add(p.buyer,p.plat)));
 }catch(e){console.warn('No se pudieron consultar los cupiditos de borradores',e)}
 (privateWork?.contenido?.productos||[]).forEach(p=>add(p.buyer,p.plat));
 draftCupiditos=[...matches.values()].sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
}

 el.innerHTML=matches.map((c,i)=>`<button type="button" class="sug" data-act="draftChooseCupidito" data-cupidito-index="${draftCupiditos.indexOf(c)}"><strong>${esc(c.nombre)}</strong>${c.plat?`<small>${esc(c.plat)}</small>`:''}</button>`).join('');
 el.hidden=!matches.length;
}

   const el=$('#dlg [data-charge-id="'+p.id+'"][data-charge-key="'+key+'"]');

async function previsualizarJP1(file){
 const status=$('#jpPreviewStatus'),out=$('#jpPreviewResults');if(!status||!out)return;
 status.textContent='Validando archivo y consultando Supabase…';out.innerHTML='';
 try{
  if(!await refreshAdmin()||!adminSession?.token)throw Error('Inicia sesión como administrador.');
  if(file.size>2*1024*1024)throw Error('El archivo JSON es demasiado grande.');
  const data=JSON.parse(await file.text());
  if(data.origen!=='JP #1'||data.modo!=='preparacion_sin_importar'||!Array.isArray(data.productos)||!Array.isArray(data.pendientes))throw Error('Selecciona japon_jp1_preparacion.json, no el JSON original.');
  const productos=data.productos;
  if(productos.length>100||productos.some(x=>x.hoja!=='JP #1'||!/^JAPON-JP1-FILA[0-9]+$/.test(x.referencia_excel||'')))throw Error('Hay registros inesperados en el archivo.');
  const refs=productos.map(x=>x.referencia_excel);
  if(new Set(refs).size!==refs.length)throw Error('El archivo contiene referencias duplicadas.');
  const r=await fetch(AUTH_URL+'/rest/v1/productos?select=referencia_excel,nombre,imagen_url&referencia_excel=like.JAPON-JP1-*',{headers:{apikey:AUTH_PUBLISHABLE_KEY,Authorization:'Bearer '+adminSession.token},cache:'no-store'});
  if(!r.ok)throw Error('No se pudo consultar productos ('+r.status+').');
  const existentes=await r.json(),byRef=new Map(existentes.map(x=>[x.referencia_excel,x]));
  const nuevos=productos.filter(x=>!byRef.has(x.referencia_excel)),ya=productos.filter(x=>byRef.has(x.referencia_excel));
  status.textContent=`${productos.length} productos identificados · ${nuevos.length} nuevos · ${ya.length} existentes · ${data.pendientes.length} filas pendientes de revisión`;
  out.innerHTML=`<p><strong>Sin cambios realizados.</strong> Los productos existentes no se sobrescribirán.</p><h3 style="margin:18px 0 8px">Ya existentes</h3><p>${ya.length?ya.map(x=>esc(x.referencia_excel)+' · '+esc(x.descripcion)).join('<br>'):'Ninguno'}</p><h3 style="margin:18px 0 8px">Por crear (vista previa)</h3><div style="max-height:330px;overflow:auto"><table><thead><tr><th>Fila</th><th>Producto</th><th>Comprador original</th></tr></thead><tbody>${nuevos.map(x=>`<tr><td>${x.fila}</td><td>${esc(x.descripcion)}</td><td>${esc(x.comprador||'Sin asignar')}</td></tr>`).join('')}</tbody></table></div><h3 style="margin:18px 0 8px">Revisión manual</h3><p>${data.pendientes.map(x=>'Fila '+x.fila+' · sin descripción/precio').join('<br>')||'Ninguna'}</p>`;
 }catch(e){status.textContent='No se pudo completar la vista previa.';out.textContent=e.message||'Error al leer archivo';}
}

 if(oldW&&oldH)for(const s of A){s.x=s.x/oldW*W;s.y=s.y/oldH*H}
}
function particle(){
 const r=Math.max(2,T.particleSize)*(.5+Math.random()*.9),a=Math.random()*Math.PI*2;
 return{x:Math.random()*W,y:Math.random()*H,r,dx:Math.cos(a),dy:Math.sin(a),rot:Math.random()*6.28,vr:(Math.random()-.5)*.008,color:[T.particleColor,T.particleSecond,T.particleThird][Math.random()*3|0],opacity:.4+Math.random()*.6,shape:T.particleShape==='mix'?['heart','star','circle','sparkle'][Math.random()*4|0]:T.particleShape};
}
function sync(){
 const n=T.particles?Math.min(160,Math.max(0,Math.round(T.particleCount))):0;
 while(A.length<n)A.push(particle());
 if(A.length>n)A.length=n;
 // Los cambios de apariencia no reinician posiciones ni velocidades.
}
function draw(s){const r=s.r;x.save();x.translate(s.x,s.y);x.rotate(s.rot);x.fillStyle=s.color;x.strokeStyle=s.color;x.globalAlpha=s.opacity*T.particleOpacity/100;x.beginPath();if(s.shape==='circle'){x.arc(0,0,r*.6,0,Math.PI*2);x.fill()}else if(s.shape==='star'){for(let j=0;j<10;j++){const a=-Math.PI/2+j*Math.PI/5,rr=j%2?r*.42:r;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.closePath();x.fill()}else if(s.shape==='sparkle'){x.moveTo(0,-r);x.quadraticCurveTo(r*.13,-r*.13,r,0);x.quadraticCurveTo(r*.13,r*.13,0,r);x.quadraticCurveTo(-r*.13,r*.13,-r,0);x.quadraticCurveTo(-r*.13,-r*.13,0,-r);x.fill()}else{x.moveTo(0,r*.85);x.bezierCurveTo(-r*1.3,r*.1,-r,-r,0,-r*.35);x.bezierCurveTo(r,-r,r*1.3,r*.1,0,r*.85);x.fill()}x.restore()}
function frame(t){
 raf=0;
 // Tiempo real entre cuadros, limitado para evitar saltos tras cambiar de pestaña.
 const dt=last?Math.min(40,Math.max(0,t-last)):16.67;last=t;
 x.clearRect(0,0,W,H);
 if(T.particles){
  const moving=!rm.matches&&T.particleDrift&&T.particleSpeed>0;
  const step=dt/16.67*Math.min(1.5,Math.max(0,T.particleSpeed/100));
  for(const s of A){
   if(moving){
    s.x+=s.dx*step;s.y+=s.dy*step;s.rot+=s.vr*step;
    if(s.x<-s.r)s.x=W+s.r;else if(s.x>W+s.r)s.x=-s.r;
    if(s.y<-s.r)s.y=H+s.r;else if(s.y>H+s.r)s.y=-s.r;
   }
   draw(s);
  }
 }
 if(!document.hidden)raf=requestAnimationFrame(frame);
}
function start(){if(document.hidden||raf)return;last=0;raf=requestAnimationFrame(frame)}
function onTheme(){sync();start()}
size();sync();start();
addEventListener('dc-theme',onTheme);
addEventListener('resize',()=>{size();start()});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;last=0}
 else start();
});
rm.addEventListener?.('change',start);
})();
