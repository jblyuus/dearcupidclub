<script>

async function cargarCategoriasSupabase() {
  try {
    const respuesta = await fetch(
      AUTH_URL + '/rest/v1/categorias?select=id,nombre,orden,activa&order=orden.asc',
      {
        headers: {
          apikey: AUTH_PUBLISHABLE_KEY
        }
      }
    );

    if (!respuesta.ok) {
      throw new Error('Error al consultar categorías: ' + respuesta.status);
    }

    const categorias = await respuesta.json();

    console.log('Categorías cargadas desde Supabase:', categorias);

    return categorias;
  } catch (error) {
    console.error('Error de conexión con Supabase:', error);
    return null;
  }
}

async function uploadCustomFont(file){
 if(!file)return;
 const error=$('#customFontError');
 if(!/\.(woff2?|ttf|otf)$/i.test(file.name)||file.size>3*1048576){if(error)error.textContent='Usa WOFF2, WOFF, TTF u OTF de máximo 3 MB.';return}
 try{
 const url=URL.createObjectURL(file);
 try{const test=new FontFace('DearcupidCustom',`url(${url})`);await test.load();document.fonts.add(test)}finally{URL.revokeObjectURL(url)}
 await imgStore.put('custom-font',file);
 await loadCustomFont();T.font='custom';T.heading='same';applyTheme();saveTheme();rerender();toast('Fuente personalizada aplicada');
 }catch(e){if(error)error.textContent='No se pudo leer o guardar esa fuente.'}
}

function setThemeField(k,v){if(!(k in themeDefaults))return;if(typeof themeDefaults[k]==='number')v=Number(v);if(typeof themeDefaults[k]==='boolean')v=v==='true';if(typeof themeDefaults[k]==='number'&&!Number.isFinite(v))return;T[k]=v;applyTheme();saveTheme()}
function resetTheme(){T={...themeDefaults};applyTheme();saveTheme();rerender()}
function exportTheme(){const blob=new Blob([JSON.stringify({format:'dearcupid-theme-v1',settings:T},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='dearcupid-diseno.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function importTheme(file){try{if(file.size>100000)throw Error('El archivo es demasiado grande');const obj=JSON.parse(await file.text());if(obj.format!=='dearcupid-theme-v1'||!obj.settings||typeof obj.settings!=='object')throw Error('No es un diseño compatible');const clean={...themeDefaults};for(const [k,v] of Object.entries(obj.settings)){if(!(k in clean)||typeof v!==typeof clean[k])continue;if(typeof v==='string'&&v.length>150)continue;clean[k]=v}for(const k of Object.keys(themeColorLabels).concat(['particleColor','particleSecond','particleThird']))if(!/^#[0-9a-f]{6}$/i.test(clean[k]))throw Error('Un color no es válido');T=clean;applyTheme();saveTheme();rerender();toast('Diseño importado')}catch(e){toast(e.message||'No se pudo importar',1)}}

let S={q:'',lg:'',pay:'',sort:'name',view:innerWidth>800?'table':'gallery',page:1,box:''};const PER=8;

(()=>{const c=document.createElement('canvas');c.id='stars';c.setAttribute('aria-hidden','true');document.body.prepend(c);const x=c.getContext('2d'),rm=matchMedia('(prefers-reduced-motion:reduce)');let W=0,H=0,A=[],running=false,token=0;
