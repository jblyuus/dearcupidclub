<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>dearcupid club</title>
    <style>
      :root {
        --bg: #fffafc;
        --p1: #fae8ed;
        --p2: #ffb2c5;
        --p3: #fdd5df;
        --p4: #ffc2d1;
        --ac: #ffa2b9;
        --ib: #d4849f;
        --tx: #29262a;
        --t2: #6f686e;
        --bd: #fdd5df;
        --sf: #fff;
        --r: 18px;
        --sh: 0 2px 14px rgba(120, 70, 95, 0.06);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          16px/1.55 "DM Sans",
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
      }
      a {
        color: inherit;
      }
      h1,
      h2,
      h3 {
        font-weight: 600;
        line-height: 1.2;
        margin: 0;
      }
      :focus-visible {
        outline: 3px solid var(--ac);
        outline-offset: 2px;
        border-radius: 8px;
      }
      .w {
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 20px;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(255, 252, 253, 0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--bd);
      }
      .hd {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 64px;
        flex-wrap: wrap;
        padding: 8px 0;
      }
      .lg {
        height: 44px;
        max-width: 150px;
        display: flex;
        align-items: center;
      }
      .lg img {
        height: 100%;
        width: 100%;
        object-fit: contain;
      }
      .lgph {
        border: 1.5px dashed var(--p2);
        border-radius: 12px;
        padding: 6px 12px;
        font-size: 0.8rem;
        color: var(--t2);
        text-decoration: none;
        min-height: 44px;
        display: flex;
        align-items: center;
      }
      header nav {
        display: flex;
        gap: 4px;
        margin-left: auto;
        flex-wrap: wrap;
      }
      header nav a {
        padding: 10px 14px;
        border-radius: 99px;
        text-decoration: none;
        color: var(--t2);
        font-size: 0.92rem;
        transition: 0.2s;
      }
      header nav a:hover,
      header nav a[aria-current] {
        background: var(--p1);
        color: var(--tx);
      }
      header nav a.adm {
        font-size: 0.8rem;
        border: 1px solid var(--bd);
      }
      main {
        padding: 36px 0 60px;
        min-height: 70vh;
        animation: in 0.3s ease;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      body {
        background:
          radial-gradient(
            900px 500px at 50% -120px,
            var(--p1),
            transparent 70%
          ),
          var(--bg);
        background-attachment: fixed;
      }
      .home #hl {
        display: none;
      }
      .home header {
        background: transparent;
        border-color: transparent;
      }
      .home .hd {
        justify-content: center;
      }
      .home header nav {
        margin: 0 auto;
        justify-content: center;
      }
      .hero {
        text-align: center;
        padding: 24px 0 20px;
      }
      .hero .lg {
        height: auto;
        width: min(92%, var(--logo-w, 270px));
        max-width: none;
        margin: 0 auto 20px;
        animation: in 0.5s ease;
      }
      .hero .lg img {
        height: auto;
        max-height: calc(var(--logo-w, 270px) * 1.15);
        width: 100%;
        object-fit: contain;
      }
      .prev {
        background: var(--bg);
        border: 1px dashed var(--p2);
        border-radius: 14px;
        padding: 14px;
        text-align: center;
        overflow: hidden;
        margin: 10px 0;
      }
      .prev img {
        max-width: 100%;
        height: auto;
        object-fit: contain;
      }
      input[type="range"] {
        padding: 0;
        accent-color: #d4849f;
      }
      .hero .lgph {
        width: min(86%, 320px);
        height: 200px;
        margin: 0 auto 22px;
        justify-content: center;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.6);
      }
      .carrd {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px;
        border-radius: 99px;
        background: var(--sf);
        border: 1px solid var(--p2);
        text-decoration: none;
        font-weight: 500;
        box-shadow: var(--sh);
        transition: 0.25s;
      }
      .carrd:hover {
        background: var(--p1);
        transform: translateY(-2px);
      }
      .menu {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        max-width: 760px;
        margin: 34px auto 0;
      }
      .menu a {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 18px;
        border-radius: 20px;
        background: var(--sf);
        border: 1px solid var(--bd);
        box-shadow: var(--sh);
        text-decoration: none;
        font-weight: 500;
        transition: 0.25s;
        min-height: 64px;
      }
      .menu a:hover {
        transform: translateY(-3px);
        border-color: var(--ac);
        background: var(--p1);
      }
      .menu .ic {
        margin: 0;
        flex: none;
      }
      .menu small {
        display: block;
        color: var(--t2);
        font-weight: 400;
        font-size: 0.8rem;
        line-height: 1.3;
      }
      .hero h1 {
        font-size: clamp(2rem, 7vw, 3.2rem);
        letter-spacing: -0.02em;
      }
      .hero p {
        max-width: 560px;
        margin: 16px auto 24px;
        color: var(--t2);
      }
      .sb {
        display: flex;
        gap: 8px;
        max-width: 480px;
        margin: auto;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--tx);
        background: var(--sf);
        border: 1px solid var(--ib);
        border-radius: 12px;
        padding: 11px 14px;
        min-height: 46px;
        width: 100%;
      }
      textarea {
        min-height: 80px;
        resize: vertical;
      }
      .btn {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--ib);
        background: var(--sf);
        color: var(--tx);
        border-radius: 12px;
        padding: 10px 18px;
        min-height: 46px;
        transition: 0.2s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--p1);
      }
      .btn.pri {
        background: var(--ac);
        border-color: var(--ac);
        color: #29262a;
        font-weight: 600;
      }
      .btn.pri:hover {
        background: var(--p2);
      }
      .btn.sm {
        min-height: 44px;
        padding: 6px 14px;
        font-size: 0.88rem;
      }
      .btn.dng {
        border-color: #b4415f;
        color: #8d2a45;
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      }
      .card {
        background: var(--sf);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        box-shadow: var(--sh);
        padding: 20px;
        transition: 0.25s;
      }
      a.card {
        display: block;
        text-decoration: none;
      }
      a.card:hover {
        transform: translateY(-3px);
        border-color: var(--p2);
      }
      .ic {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: var(--p1);
        display: grid;
        place-items: center;
        font-size: 1.2rem;
        margin-bottom: 12px;
        color: #8a4a68;
      }
      .card p {
        margin: 6px 0 0;
        color: var(--t2);
        font-size: 0.92rem;
      }
      h2.s {
        font-size: 1.25rem;
        margin: 44px 0 16px;
      }
      .bc {
        font-size: 0.88rem;
        color: var(--t2);
        margin-bottom: 16px;
      }
      .bc a {
        color: var(--t2);
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin: 18px 0;
        border-bottom: 1px solid var(--bd);
        overflow-x: auto;
      }
      .tabs a {
        padding: 12px 16px;
        text-decoration: none;
        color: var(--t2);
        border-bottom: 2px solid transparent;
        white-space: nowrap;
      }
      .tabs a[aria-current] {
        color: var(--tx);
        border-color: var(--ac);
        font-weight: 600;
      }
      .b {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        padding: 3px 10px;
        border-radius: 99px;
        font-size: 0.78rem;
        border: 1px solid var(--p2);
        background: var(--p1);
        white-space: nowrap;
      }
      .b.k2 {
        background: #e9f5ea;
        border-color: #a8d3ac;
        color: #1f5a27;
      }
      .b.k0 {
        background: #fff7e6;
        border-color: #e8cf95;
        color: #6b4d0a;
      }
      .b.k1 {
        background: #eef3fb;
        border-color: #b7c9e6;
        color: #26456f;
      }
      .bar {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        margin-bottom: 18px;
        align-items: end;
      }
      label {
        font-size: 0.84rem;
        color: var(--t2);
        display: block;
        margin-bottom: 4px;
      }
      .gal {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      }
      .pc {
        padding: 0;
        overflow: hidden;
      }
      .pc .im {
        aspect-ratio: 1;
        width: 100%;
        border: 0;
        display: block;
        padding: 0;
        background: var(--p1);
        cursor: zoom-in;
      }
      .pc .bd {
        padding: 14px;
        display: grid;
        gap: 8px;
      }
      .ph {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        color: var(--p2);
        font-size: 2rem;
      }
      .ph img,
      .th img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .th {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        overflow: hidden;
        background: var(--p1);
        border: 0;
        padding: 0;
        cursor: zoom-in;
        flex: none;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--sf);
        border-radius: var(--r);
        overflow: hidden;
        box-shadow: var(--sh);
      }
      th,
      td {
        text-align: left;
        padding: 12px 14px;
        border-bottom: 1px solid var(--bd);
        vertical-align: middle;
        font-size: 0.92rem;
      }
      th {
        background: var(--p1);
        font-weight: 600;
      }
      @media (max-width: 760px) {
        thead {
          position: absolute;
          left: -9999px;
        }
        table,
        tbody {
          display: block;
          width: 100%;
        }
        tr {
          display: block;
          padding: 10px 4px;
          border-bottom: 8px solid var(--bg);
        }
        td {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          justify-content: space-between;
          gap: 8px 12px;
          border: 0;
          padding: 6px 14px;
          text-align: right;
          min-width: 0;
        }
        td::before {
          content: attr(data-l);
          color: var(--t2);
          text-align: left;
        }
        td[data-l="Acciones"] {
          justify-content: flex-start;
        }
        td[data-l="Acciones"]::before {
          flex-basis: 100%;
        }
        table {
          box-shadow: none;
          border: 1px solid var(--bd);
        }
      }
      .pg {
        display: flex;
        gap: 6px;
        justify-content: center;
        margin-top: 20px;
        flex-wrap: wrap;
      }
      .pg .btn[aria-current] {
        background: var(--p1);
        font-weight: 700;
      }
      .empty {
        text-align: center;
        padding: 50px 20px;
        color: var(--t2);
        border: 1.5px dashed var(--p2);
        border-radius: var(--r);
      }
      .stat {
        font-size: 1.8rem;
        font-weight: 600;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .sp {
        justify-content: space-between;
      }
      dialog {
        border: 0;
        border-radius: 22px;
        padding: 24px;
        width: min(560px, 94vw);
        max-height: 92vh;
        box-shadow: 0 20px 60px rgba(60, 30, 45, 0.2);
        color: var(--tx);
        animation: in 0.2s;
      }
      dialog::backdrop {
        background: rgba(41, 38, 42, 0.4);
      }
      dialog img.big {
        max-width: 100%;
        max-height: 78vh;
        display: block;
        margin: auto;
        object-fit: contain;
      }
      dialog:has(img.big) {
        width: min(960px, 96vw);
        max-height: 94vh;
      }
      dialog:has(img.big) form {
        min-width: 0;
      }
      dialog:has(img.big) img.big {
        border-radius: 12px;
      }
      .f {
        display: grid;
        gap: 12px;
        margin-top: 14px;
      }
      .f2 {
        display: grid;
        gap: 12px;
        grid-template-columns: 1fr 1fr;
      }
      .err {
        color: #8d2a45;
        font-size: 0.9rem;
        min-height: 1.2em;
      }
      .drop {
        border: 1.5px dashed var(--p2);
        border-radius: 14px;
        padding: 14px;
        display: grid;
        gap: 10px;
        background: var(--bg);
      }
      .drop img {
        max-height: 160px;
        object-fit: contain;
        margin: auto;
      }
      #toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        display: grid;
        gap: 8px;
      }
      .t {
        background: var(--tx);
        color: #fff;
        padding: 12px 18px;
        border-radius: 14px;
        animation: in 0.25s;
        font-size: 0.92rem;
      }
      .t.e {
        background: #8d2a45;
      }
      .sk {
        height: 120px;
        border-radius: var(--r);
        background: linear-gradient(90deg, var(--p1), #fff, var(--p1));
        background-size: 200% 100%;
        animation: sk 1.2s infinite;
      }
      @keyframes sk {
        to {
          background-position: -200% 0;
        }
      }
      footer {
        border-top: 1px solid var(--bd);
        padding: 26px 0;
        color: var(--t2);
        font-size: 0.88rem;
        text-align: center;
      }
      .note {
        background: var(--p1);
        border-radius: 14px;
        padding: 12px 16px;
        margin-bottom: 8px;
      }
      .sr {
        position: absolute;
        left: -9999px;
      }

      :root {
        --e: cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      main {
        animation: in 0.5s var(--e);
      }
      .card,
      .btn,
      .menu a,
      nav a,
      .carrd,
      .tag,
      input,
      select,
      textarea,
      .b {
        transition:
          transform 0.35s var(--e),
          box-shadow 0.35s var(--e),
          background-color 0.25s ease,
          border-color 0.25s ease,
          color 0.25s ease;
      }
      .menu a,
      .grid > *,
      .gal > * {
        animation: in 0.55s var(--e) backwards;
      }
      .menu a:nth-child(2),
      .grid > *:nth-child(2),
      .gal > *:nth-child(2) {
        animation-delay: 0.06s;
      }
      .menu a:nth-child(3),
      .grid > *:nth-child(3),
      .gal > *:nth-child(3) {
        animation-delay: 0.12s;
      }
      .menu a:nth-child(4),
      .grid > *:nth-child(4),
      .gal > *:nth-child(4) {
        animation-delay: 0.18s;
      }
      .menu a:nth-child(5),
      .grid > *:nth-child(5),
      .gal > *:nth-child(5) {
        animation-delay: 0.24s;
      }
      .menu a:nth-child(n + 6),
      .grid > *:nth-child(n + 6),
      .gal > *:nth-child(n + 6) {
        animation-delay: 0.3s;
      }
      .btn:active,
      .menu a:active,
      a.card:active,
      .carrd:active {
        transform: scale(0.97);
      }
      .card:hover,
      .menu a:hover {
        box-shadow: 0 10px 30px rgba(120, 70, 95, 0.12);
      }
      dialog {
        animation: in 0.35s var(--e);
      }
      dialog::backdrop {
        animation: fade 0.3s ease;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      .t {
        animation: in 0.4s var(--e);
      }
      .tag {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 99px;
        border: 1px solid var(--bd);
        font-size: 0.78rem;
        color: var(--t2);
        text-decoration: none;
        background: var(--sf);
      }
      .tag:hover {
        background: var(--p1);
        color: var(--tx);
      }
      main,
      footer {
        position: relative;
        z-index: 1;
      }
      #stars {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }
      .bn {
        margin: 14px -20px -8px;
        height: clamp(110px, 26vw, 220px);
        overflow: hidden;
        -webkit-mask-image:
          linear-gradient(
            to bottom,
            transparent,
            #000 32%,
            #000 68%,
            transparent
          ),
          linear-gradient(
            to right,
            transparent,
            #000 14%,
            #000 86%,
            transparent
          );
        -webkit-mask-composite: source-in;
        mask-image:
          linear-gradient(
            to bottom,
            transparent,
            #000 32%,
            #000 68%,
            transparent
          ),
          linear-gradient(
            to right,
            transparent,
            #000 14%,
            #000 86%,
            transparent
          );
        mask-composite: intersect;
      }
      .bn img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .lst {
        display: grid;
        gap: 10px;
      }
      .row2 {
        display: flex;
        gap: 14px;
        align-items: center;
        background: var(--sf);
        border: 1px solid var(--bd);
        border-radius: 18px;
        box-shadow: var(--sh);
        padding: 10px 16px 10px 10px;
        transition:
          transform 0.35s var(--e),
          border-color 0.25s;
      }
      .row2:hover {
        border-color: var(--p2);
      }
      .row2 .th {
        width: 68px;
        height: 68px;
      }
      .row2 .mn {
        flex: 1;
        min-width: 0;
        display: grid;
        gap: 5px;
      }
      .row2 .mn strong {
        overflow-wrap: anywhere;
      }
      .row2 .meta {
        color: var(--t2);
        font-size: 0.85rem;
      }
      .row2 .bs,
      .row2 .ac {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .row2 .pr {
        font-weight: 600;
        text-align: right;
        min-width: 64px;
      }
      @media (max-width: 520px) {
        .row2 {
          gap: 10px;
          padding: 8px 12px 8px 8px;
        }
        .row2 .th {
          width: 56px;
          height: 56px;
          align-self: flex-start;
        }
        .row2 .pr {
          font-size: 0.9rem;
          min-width: 0;
          align-self: flex-start;
        }
      }
      #hres {
        max-width: 760px;
        margin: 22px auto 0;
        text-align: left;
      }
      .res {
        margin-top: 20px;
      }
      .res h3 {
        margin-bottom: 12px;
      }
      .sug {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        width: 100%;
        text-align: left;
        padding: 10px 14px;
        margin-top: 6px;
        border: 1px solid var(--bd);
        border-radius: 12px;
        background: var(--bg);
        font: inherit;
        color: var(--tx);
        cursor: pointer;
        min-height: 44px;
      }
      .sug:hover {
        background: var(--p1);
      }
      .sug small {
        color: var(--t2);
      }
      #bsug .meta {
        color: var(--t2);
        font-size: 0.85rem;
        margin: 6px 0 0;
      }
      .ic {
        overflow: hidden;
      }
      .ic img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cup {
        text-decoration: none;
        color: var(--tx);
        padding: 14px 18px;
        min-height: 56px;
      }
      .cup:hover {
        border-color: var(--ac);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
      @media (max-width: 520px) {
        .f2 {
          grid-template-columns: 1fr;
        }
        header nav {
          margin-left: 0;
        }
      }

      // Respeta las filas originales del Excel en Corea, Japón y Pocamarket.
      function filaOriginalProducto(p) {
        const ref = String(p.referenciaExcel || "").trim();
        const mc = /^MC\s*#([123])\s+fila\s+(\d+)$/i.exec(ref);
        if (mc) return {tipo:"MC",caja:Number(mc[1]),fila:Number(mc[2])};
        const kr = /^KR\s*#([12])\s+fila\s+(\d+)$/i.exec(ref);
        if (kr) return { tipo: "KR", caja: Number(kr[1]), fila: Number(kr[2]) };
        const jp = /^JAPON-JP(\d+)-FILA(\d+)$/i.exec(ref);
        if (jp) return { tipo: "JP", caja: Number(jp[1]), fila: Number(jp[2]) };
        // Ejemplos: POCA 12 fila 4; CAJAS PICK PACK fila 46.
        // La comparación exige también el mismo ID de caja, porque las
        // cajas 15, 16 y 17 comparten la hoja CAJAS PICK PACK.
        const poca = /^(POCA\s*\d+|CAJAS\s+PICK\s+PACK)\s+fila\s+(\d+)$/i.exec(ref);
        if (poca) return { tipo: "POCA", caja: poca[1].replace(/\s+/g, " ").toUpperCase(), fila: Number(poca[2]) };
        return null;

      function compararOrdenOriginal(a, b) {
        const aa = filaOriginalProducto(a), bb = filaOriginalProducto(b);
        if (a.box === b.box) {

            return aa.fila - bb.fila || (a.ordenCarga ?? 0) - (b.ordenCarga ?? 0);

          // registros importados de esa caja, sin cambiar las demás categorías.
          if (aa && !bb && (aa.tipo === "KR" || aa.tipo === "POCA" || aa.tipo === "MC")) return -1;

              return "Ingresa un precio válido.";
            // La tabla Supabase es la fuente de verdad; nunca anunciar éxito solo por localStorage.
            try {
              if (pend.checking) return "Espera a que termine la validación de la imagen.";
              const photo = pend;
              const normalizar = (t) =>
                String(t || "")
                  .trim()
                  .replace(/^@/, "")
                  .normalize("NFKC")
                  .toLocaleLowerCase("es-MX");
              const cupiditos = await adminRequest(
                "cupiditos?select=id,nombre&limit=10000",
              );
              let matches = cupiditos.filter(
                (c) => normalizar(c.nombre) === normalizar(o.buyer),
              );
              if (matches.length > 1)
                return "Hay varios cupiditos con ese nombre. Revisa los duplicados antes de guardar.";
              if (!matches.length) {
                matches = await adminRequest("cupiditos", {
                  method: "POST",
                  headers: { Prefer: "return=representation" },
                  body: JSON.stringify({ nombre: o.buyer }),
                });
                if (
                  !Array.isArray(matches) ||
                  matches.length !== 1 ||
                  !matches[0].id
                )
                  throw Error("No se confirmó la creación del cupidito.");
              }
              const caja = box(o.box);
              if (!caja) throw Error("La caja seleccionada no existe.");
              const payload = {
                cupidito_id: matches[0].id,
                caja_id: caja.id,
                categoria_id: caja.cat,
                nombre: o.desc || "Producto sin descripción",
                descripcion: o.desc || "",
                precio: o.price,
                moneda: "MXN",
                estado: LOGI[o.logi] || LOGI[0],
                plataforma: o.plat,
                ems: o.ems,
                aduana: o.adu,
              };
              if (photo.rm) payload.imagen_url = null;
              if (photo.blob) {
                if (!photo.uploaded) photo.uploaded = await uploadR2Image(photo.blob, "productos");
                payload.imagen_url = photo.uploaded;
              }
              const endpoint = ne
                ? "productos"
                : "productos?id=eq." + encodeURIComponent(p.id);
              const rows = await adminRequest(endpoint, {
                method: ne ? "POST" : "PATCH",
                headers: { Prefer: "return=representation" },
                body: JSON.stringify(payload),
              });
              if (!Array.isArray(rows) || rows.length !== 1 || !rows[0].id)
                throw Error(
                  "Supabase no confirmó que se guardara exactamente un producto.",
                );
              await sincronizarProductosSupabase();
              toast(
                ne
                  ? "Producto creado ♡"
                  : "Producto actualizado ♡",
              );
              return 0;
            } catch (e) {
              console.error("Error guardando producto en Supabase:", e);
              return "No se guardó el producto: " + (e.message || String(e));
            }
          },
        );
        if (pend.old) setPv(pend.old);
        else if (p.imgId) imgUrl(p.imgId).then((u) => u && $("#pv") && setPv(u));
      }

      let draftCupiditos = [];

        String(v || "")

      async function cargarCupiditosParaBorradores() {
        const matches = new Map();
        const add = (nombre, plat) => {
          const key = normCupidito(nombre);
          if (!key) return;
          const old = matches.get(key);
          if (!old)
            matches.set(key, {
              nombre: String(nombre).trim(),
              plat: plat || "",
            });
          else if (!old.plat && plat) old.plat = plat;
        };
        (D.prods || []).forEach((p) => add(p.buyer, p.plat));
        try {
          const r = await fetch(
            AUTH_URL + "/rest/v1/cupiditos?select=nombre,alias&limit=1000",
            {
              headers: {
                apikey: AUTH_PUBLISHABLE_KEY,
                Authorization: "Bearer " + adminSession.token,
              },
            },
          );
          if (r.ok)
            (await r.json()).forEach((c) => add(c.alias || c.nombre, ""));
        } catch (e) {
          console.warn("No se pudieron consultar los cupiditos registrados", e);
        }
        try {
          const borradores = await listarBorradoresCaja();
          borradores.forEach((b) =>
            (b.contenido?.productos || []).forEach((p) => add(p.buyer, p.plat)),
          );
        } catch (e) {
          console.warn(
            "No se pudieron consultar los cupiditos de borradores",
            e,
          );
        }
        (privateWork?.contenido?.productos || []).forEach((p) =>
          add(p.buyer, p.plat),

        draftCupiditos = [...matches.values()].sort((a, b) =>

          actual.productos.map((p) => [p.id, Number(p.logi)]),

      async function saveChargesDraft() {
        if (!chargesWork) throw Error("No hay un borrador abierto.");
        const values = { ...chargesWork.values };
        for (const p of chargesWork.products) {
          const v = { ...(values[p.id] || {}) };
          for (const key of ["ems", "aduana", "otros"]) {
            const el = $(
              '#dlg [data-charge-id="' +
                p.id +
                '"][data-charge-key="' +
                key +
                '"]',
            );
            const raw = el?.value.trim() || "";
            if (raw === "") {
              delete v[key];
              continue;
            }
            const n = Number(raw);
            if (
              !Number.isFinite(n) ||
              n < 0 ||
              !/^\d+(?:\.\d{1,2})?$/.test(raw)
            )
              throw Error(
                "Revisa el importe de " +
                  (p.desc || "producto") +
                  " (" +
                  key +
                  ").",
              );
            v[key] = n;
          }
          if (Object.keys(v).length) values[p.id] = v;
          else delete values[p.id];
        }
        await chargesDraftRequest("?on_conflict=caja_id", {
          method: "POST",
          headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
          body: JSON.stringify({
            caja_id: chargesWork.bid,
            contenido: { productos: values },
            actualizado_en: new Date().toISOString(),
          }),
        });
        chargesWork.values = values;
        const status = $("#chargesDraftStatus");
        if (status) {
          status.style.color = "#286b44";
          status.textContent = "Borrador guardado ♡";
        }
      }

      function renderCargosAgrupados(products, admin) {
        const groups = new Map();
        for (const p of [...products].sort(compararOrdenOriginal)) {
          const c = publishedCharges[p.id];
          if (!c) continue;
          const key = nmz(p.buyer) || "(sin cupidito)";
          if (!groups.has(key))
            groups.set(key, {
              name: p.buyer || "Sin cupidito",
              items: [],
              ems: 0,
              aduana: 0,
              pendiente: 0,
            });
          const g = groups.get(key);
          g.items.push({ p, c });
          g.ems += Number(c.ems) || 0;
          g.aduana += Number(c.aduana) || 0;
          if (!c.ems_pagado) g.pendiente += Number(c.ems) || 0;
          if (!c.aduana_pagada) g.pendiente += Number(c.aduana) || 0;
        }
        if (!groups.size)
          return '<div class="empty">Esta caja todavía no tiene cargos publicados.</div>';
        const all = [...groups.values()]; // Orden de primera aparición en la masterlist, no alfabético.
        const total = admin ? all.reduce((n, g) => n + g.pendiente, 0) : 0;
        const status = (amount, paid, explicit) => {
          const e = String(explicit || "").trim().toLowerCase();
          if (e === "pagado" || paid) return "Pagado";
          if (["sin cobro", "sin cargo", "cero", "0", "confirmado 0"].includes(e)) return "Sin cobro";
          if (e === "pendiente") return "Pendiente";
          return Number(amount) > 0 ? "Pendiente" : "Sin cargo";
        };
        const chargeLabel = (amount, paid, explicit) => {
          const e = String(explicit || "").trim().toLowerCase();
          if (e === "pagado" && Number(amount) === 0) return "Pagado";
          if (["sin cobro", "sin cargo", "cero", "0", "confirmado 0"].includes(e)) return money(0) + " · Sin cobro";
          return money(amount) + " · " + status(amount, paid, explicit);
        };
        return `${admin ? `<div class="card" style="margin:12px 0 18px"><strong>${all.length} cupidito(s) · ${products.length} productos</strong><p>EMS: ${money(all.reduce((n, g) => n + g.ems, 0))} · Aduana: ${money(all.reduce((n, g) => n + g.aduana, 0))}</p><strong>Total pendiente: ${money(total)}</strong></div>` : ""}<div class="lst">${all
          .map(
            (g) =>
              `<details class="card" data-cargo-cupidito="${esc(nmz(g.name))}" style="padding:16px"><summary style="cursor:pointer"><strong>${esc(g.name)}</strong> · ${g.items.length} producto(s)<div style="margin-top:6px;color:var(--t2)">EMS ${money(g.ems)} · Aduana ${money(g.aduana)}</div><strong>Pendiente: ${money(g.pendiente)}</strong></summary><div style="margin-top:14px;display:grid;gap:12px">${g.items
                .map(
                  ({ p, c }) =>
                    `<div style="padding:12px;border:1px solid var(--bd);border-radius:12px"><strong>${esc(p.desc || "Producto")}</strong>${[
                      ["ems", "ems_pagado", "EMS"],
                      ["aduana", "aduana_pagada", "Aduana"],

                      .map(
                        ([field, col, label]) =>
                          `<div class="row sp" style="margin-top:9px"><span>${label}: ${chargeLabel(c[field], c[col], field === "ems" ? p.emsEstado : p.aduEstado)}</span>${admin && Number(c[field]) > 0 ? `<button type="button" class="btn sm" data-act="toggleChargePaid" data-id="${esc(p.id)}" data-charge-col="${col}" data-paid="${c[col] ? "1" : "0"}">${c[col] ? "Marcar pendiente" : "Marcar pagado"}</button>` : ""}</div>`,
                      )
                      .join("")}</div>`,
                )
                .join("")}</div></details>`,
          )
          .join("")}</div>`;

        const r = await fetch(AUTH_URL + "/rest/v1/rpc/es_admin", {
          method: "POST",
          headers: {
            apikey: AUTH_PUBLISHABLE_KEY,
            Authorization: "Bearer " + token,

      async function loginAdmin(email, password) {
        if (!authConfigured())
          throw Error(
            "Falta configurar la clave publicable de Supabase en el HTML.",
          );
        const r = await fetch(AUTH_URL + "/auth/v1/token?grant_type=password", {
          method: "POST",
          headers: {
            apikey: AUTH_PUBLISHABLE_KEY,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ email, password }),
        });
        const j = await r.json();
        if (!r.ok || !j.access_token)
          throw Error(
            "No se pudo iniciar sesión. Revisa tu correo y contraseña.",
          );
        const ok = await verifyAdmin(j.access_token);
        if (!ok)
          throw Error(
            "La cuenta no tiene acceso administrativo o no se pudo verificar.",
          );
        adminSession = {
          token: j.access_token,
          refresh: j.refresh_token,
          expires: Date.now() + (j.expires_in || 3600) * 1000,
        };
        adminReady = true;
      }
      async function refreshAdmin() {
        if (!adminSession || !authConfigured()) return false;
        if (Date.now() < adminSession.expires - 60000)
          return verifyAdmin(adminSession.token);
        try {
          const r = await fetch(
            AUTH_URL + "/auth/v1/token?grant_type=refresh_token",
            {
              method: "POST",
              headers: {
                apikey: AUTH_PUBLISHABLE_KEY,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ refresh_token: adminSession.refresh }),
            },
          );
          if (!r.ok) throw Error("Sesión expirada");
          const j = await r.json();
          if (!(await verifyAdmin(j.access_token))) throw Error("Sin permisos");
          adminSession = {
            token: j.access_token,
            refresh: j.refresh_token,
            expires: Date.now() + (j.expires_in || 3600) * 1000,
          };
          return true;
        } catch (e) {
          adminSession = null;
          adminReady = false;
          return false;
        }
      }

      async function sincronizarProductosSupabase() {
        const headers = { apikey: AUTH_PUBLISHABLE_KEY };
        const productos = [];
        const pageSize = 500;
        let offset = 0;
        const seen = new Set();
        while (true) {
          const r = await fetch(
            AUTH_URL +
              "/rest/v1/productos?select=id,caja_id,categoria_id,cupidito_id,nombre,descripcion,precio,moneda,estado,plataforma,imagen_url,referencia_excel,ems,aduana,ems_estado,aduana_estado,created_at&order=created_at.asc,id.asc&limit=" + pageSize + "&offset=" + offset,
            { headers, cache: "no-store" },
          );
          if (!r.ok)
            throw Error("No se pudieron cargar los productos públicos (" + r.status + ").");
          const rows = await r.json();
          if (!Array.isArray(rows)) throw Error("Respuesta de productos inválida.");
          if (!rows.length) break;
          for (const row of rows) {
            if (!row.id || seen.has(row.id))
              throw Error("La lista cambió durante la carga. Recarga la página.");
            seen.add(row.id);
            productos.push(row);
          }
          offset += rows.length;
        }
        console.info("Productos públicos cargados:", productos.length);
        let names = {};
        if (productos.some((p) => p.cupidito_id)) {
          const c = await fetch(
            AUTH_URL + "/rest/v1/cupiditos_publicos?select=*&limit=10000",
            { headers, cache: "no-store" },
          );
          if (!c.ok)
            throw Error(
              "No se pudo cargar la lista pública de cupiditos (" +
                c.status +
                ").",
            );
          const rows = await c.json();
          for (const x of rows) {
            const id = x.id || x.cupidito_id;
            if (id) names[id] = x.nombre || x.username || x.alias || "";
          }
        }
        const states = [
          "comprado",
          "asegurado",
          "en dirección coreana",
          "en dirección japonesa",
          "en camino a méxico",
          "en méxico",
          "entregado",
          "stock",
          "sin asignar",

          logi: Math.max(
            0,
            states.indexOf(String(p.estado || "comprado").toLowerCase()),
          ),
          ems: Number(p.ems) || 0,
          adu: Number(p.aduana) || 0,
          emsEstado: p.ems_estado || "",
          aduEstado: p.aduana_estado || "",
          imgId: "",
          imagenUrl: validProductImage(p.imagen_url),
          pay: 0,
        }));
      }

      async function adminRequest(path, options = {}) {
        if (!(await refreshAdmin()) || !adminSession?.token)
          throw Error("Sesión administrativa expirada.");
        const r = await fetch(AUTH_URL + "/rest/v1/" + path, {
          ...options,
          headers: {
            apikey: AUTH_PUBLISHABLE_KEY,
            Authorization: "Bearer " + adminSession.token,
            ...(options.body ? { "Content-Type": "application/json" } : {}),
            ...(options.headers || {}),
          },
          cache: "no-store",
        });
        if (!r.ok)
          throw Error(
            "Supabase " + r.status + ": " + (await r.text()).slice(0, 240),
          );
        // Supabase con Prefer: return=minimal responde sin cuerpo (a menudo HTTP 201).
        // Una respuesta vacía es válida; no intentar JSON.parse sobre ella.
        const raw = await r.text();
        if (!raw.trim()) return null;
        try {
          return JSON.parse(raw);
        } catch (e) {
          throw Error(
            "Supabase devolvió una respuesta no válida (" + r.status + ").",
          );
        }
      }

      async function normalizarImagen(file) {
        const b = new Uint8Array(await file.slice(0, 16).arrayBuffer());
        const starts = (...v) => v.every((x,i) => b[i] === x);
        let ext, type;
        if (starts(255,216,255)) { ext="jpg"; type="image/jpeg"; }
        else if (starts(137,80,78,71,13,10,26,10)) { ext="png"; type="image/png"; }
        else if (starts(71,73,70,56,55,97) || starts(71,73,70,56,57,97)) { ext="gif"; type="image/gif"; }
        else if (starts(82,73,70,70) && b[8]===87 && b[9]===69 && b[10]===66 && b[11]===80) { ext="webp"; type="image/webp"; }
        else throw Error("Formato de imagen no reconocido");
        const normalized = new File([file], file.name.replace(/\.[^.]+$/, "."+ext), {type,lastModified:file.lastModified});
        // Comprobar que el navegador puede decodificar la imagen antes de subirla.
        const url = URL.createObjectURL(normalized);
        try { await new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=()=>reject(Error("Imagen dañada"));img.src=url;}); }
        finally { URL.revokeObjectURL(url); }
        return normalized;
      }

              await publicarTamanoLogo(270);
              publicLogoWidth = 270;
              applyLogoW();
              rerender();
              toast("Tamaño restablecido para todos ♡");
            } catch (x) {
              toast(x.message || "No se pudo guardar el tamaño.", 1);
            }
            break;
          case "logoup": {
            const f = $("#lf").files[0],
              le = $("#le");
            if (!f) {
              le.textContent = "Selecciona un archivo PNG.";
              break;
            }
            if (f.type !== "image/png") {
              le.textContent = "El logo debe ser PNG.";
              break;
            }
            if (f.size > 2 * 1048576) {
              le.textContent = "El logo pesa más de 2 MB.";
              break;
            }
            try {
              const url = await uploadR2Image(f, "logo");
              await publishPublicImage("logo", url);
              await setLogo();
              toast("Logo publicado para todos ♡");
              rerender();
            } catch (x) {
              le.textContent = x.message || "No se pudo publicar el logo.";
            }
            break;
          }
          case "logodel":
            try {
              await publishPublicImage("logo", "");
              await imgStore.del("logo");
              freeUrl("logo");
              await setLogo();
              toast("Logo retirado de la página");
              rerender();
            } catch (x) {
              toast(x.message || "No se pudo eliminar.", 1);
            }
            break;
        }
      });
      document.addEventListener("submit", async (e) => {
        const f = e.target.dataset.f;
        if (!f) return;
        e.preventDefault();
        if (f === "login") {
          const er = $("#loginError");
          try {
            await loginAdmin(
              e.target.elements.email.value,
              e.target.elements.password.value,
            );
            toast("Sesión iniciada");
            await route();
          } catch (x) {
            if (er) er.textContent = x.message || "No se pudo iniciar sesión.";
          }
          return;
        }
        if (f !== "find" && f !== "login" && !adminReady) return;
        if (f === "find") homeFind();
        if (f === "dlg") {
          const form = e.target,
            submit = form.querySelector(
              'button[type="submit"],button:not([type])',
            );
          const er = form.querySelector("#er");
          if (submit?.disabled) return;
          const fd = Object.fromEntries(
            [...new FormData(form)].filter(([k, v]) => typeof v === "string"),
          );
          if (er) er.textContent = "";
          const original = submit?.textContent;
          const productPhotoControls = [...form.querySelectorAll("#pf, #prm")];
          productPhotoControls.forEach(el => el.disabled = true);
          if (submit) {
            submit.disabled = true;
            submit.textContent = "Guardando…";
          }
          try {
            const r = await onSub(fd);
            if (r) {
              if (er) er.textContent = String(r);
              else toast(String(r), 1);
              return;
            }
            // Mantener la posición de lectura al guardar desde un modal.
            const previousScrollY = window.scrollY;
            $("#dlg").close();
            S.fromNav = 0; // No es una navegación: no desplazar al inicio.
            await rerender();
            window.scrollTo({
              top: previousScrollY,
              left: 0,
              behavior: "instant",
            });
            requestAnimationFrame(() =>
              window.scrollTo({
                top: previousScrollY,
                left: 0,
                behavior: "instant",
              }),
            );
          } catch (error) {
            console.error("Error al guardar:", error);
            const message =
              error?.message || "No se pudo guardar. Inténtalo de nuevo.";
            if (er) er.textContent = message;
            toast(message, 1);
          } finally {
            productPhotoControls.forEach(el => el.disabled = false);
            if (submit) {
              submit.disabled = false;
              submit.textContent = original;
            }
          }
        }
      });
      document.addEventListener("input", (e) => {
        const t = e.target;
        if (t.dataset.theme) {
          setThemeField(t.dataset.theme, t.value);
          const o = $("#to-" + t.dataset.theme);
          if (o)
            o.textContent =
              t.value +
              (themeRange.find((x) => x[0] === t.dataset.theme)?.[5] || "");
        }
        if (t.id === "shipq") {
          $("#shiplist").innerHTML = shipRows(
            D.envios.filter((x) =>
              (
                (x.buyer || x.name || "") +
                " " +
                (x.carrier || "") +
                " " +
                (x.tracking || x.reference || "")
              )
                .toLowerCase()
                .includes(t.value.toLowerCase()),
            ),
          );
        }
        if (t.id === "hq") homeFind();
        if (t.id === "buyer") buyerSug();
        if (t.id === "cq") $("#cl").innerHTML = cupRows(CUP, t.value);
        if (t.id === "cargoSearch") {
          S.cargoSearch = t.value;
          filtrarCargosAdmin();
        }
        if (t.id === "publicCargoSearch") {
          S.publicCargoSearch = t.value;
          filtrarCargosAdmin(true);
        }
        if (t.id === "q") {
          S.q = t.value;
          S.page = 1;
          relist();
        }
        if (t.id === "lsz") {
          const v = +t.value;
          publicLogoWidth = v;
          applyLogoW();
          $("#lszv").textContent = v + "px";
          $("#lpv").style.width = v + "px";
        }
      });
      document.addEventListener("change", async (e) => {
        const t = e.target;
        if (t.id === "themePreset" && t.value) {
          T = { ...T, ...themePresets[t.value] };
          applyTheme();
          saveTheme();
          rerender();
          return;
        }
        if (t.id === "customFontFile" && t.files[0]) {
          await uploadCustomFont(t.files[0]);
          return;
        }
        if (t.id === "fl") {
          S.lg = t.value;
          S.page = 1;
          relist();
        }
        if (t.id === "fp") {
          S.pay = t.value;
          S.page = 1;
          relist();
        }
        if (t.id === "so") {
          S.sort = t.value;
          relist();
        }
        if (t.id === "cb") {
          S.cb = t.value;
          rerender();
        }
        if (t.id === "ab") {
          S.ab = t.value;
          S.page = 1;
          rerender();
        }
        if (t.id === "pf") {
          const f = t.files[0], er = $("#er"), photo = pend;
          if (!f) return;
          const version = ++photo.version;
          photo.blob = null; photo.uploaded = null;
          photo.checking = true;
          er.textContent = "";
          try {
            if (!f.size || f.size > 5 * 1048576) throw Error("Selecciona una imagen de hasta 5 MB.");
            const normalized = await normalizarImagen(f);
            if (pend !== photo || version !== photo.version || !t.isConnected || !$("#dlg").open) return;
            photo.blob = normalized;
            photo.rm = false;
            setPv(URL.createObjectURL(normalized));
          } catch (ex) {
            if (pend === photo && version === photo.version && t.isConnected) {
              er.textContent = ex.message;
              t.value = "";
              setPv(photo.rm ? null : photo.old || null);
            }
          } finally {
            if (version === photo.version) photo.checking = false;
          }
        }
        if (t.id === "bf") {
          const f = t.files[0];
          if (f && f.type.startsWith("image/")) {
            const d = t.closest(".drop"),
              i = d.querySelector("img") || document.createElement("img");
            i.src = URL.createObjectURL(f);
            i.alt = "Vista previa del nuevo banner";
            d.prepend(i);
          }
        }
        if (t.id === "lf") {
          const f = t.files[0];
          if (f && f.type === "image/png") {
            const i = $(".drop img") || document.createElement("img");
            i.src = URL.createObjectURL(f);
            i.alt = "Vista previa del nuevo logo";
            $(".drop").prepend(i);
          }
        }
      });
      /* ===== Partículas continuas: un solo ciclo, sin reinicios al cambiar de vista ===== */
      (() => {
        const c = document.createElement("canvas");
        c.id = "stars";
        c.setAttribute("aria-hidden", "true");
        document.body.prepend(c);
        const x = c.getContext("2d"),
          rm = matchMedia("(prefers-reduced-motion:reduce)");
        let W = 0,
          H = 0,
          A = [],
          raf = 0,
          last = 0;
        function size() {
          const w = Math.max(1, innerWidth),
            h = Math.max(1, innerHeight),
            oldW = W,
            oldH = H;
          W = w;
          H = h;
          const d = Math.min(devicePixelRatio || 1, 2);
          c.width = Math.round(W * d);
          c.height = Math.round(H * d);
          x.setTransform(d, 0, 0, d, 0, 0);
          if (oldW && oldH)
            for (const s of A) {
              s.x = (s.x / oldW) * W;
              s.y = (s.y / oldH) * H;
            }
        }
        function particle() {
          const r = Math.max(2, T.particleSize) * (0.5 + Math.random() * 0.9),
            a = Math.random() * Math.PI * 2;
          return {
            x: Math.random() * W,
            y: Math.random() * H,
            r,
            dx: Math.cos(a),
            dy: Math.sin(a),
            rot: Math.random() * 6.28,
            vr: (Math.random() - 0.5) * 0.008,
            color: [T.particleColor, T.particleSecond, T.particleThird][
              (Math.random() * 3) | 0
            ],
            opacity: 0.4 + Math.random() * 0.6,
            shape:
              T.particleShape === "mix"
                ? ["heart", "star", "circle", "sparkle"][
                    (Math.random() * 4) | 0
                  ]
                : T.particleShape,
          };
        }
        function sync() {
          const n = T.particles
            ? Math.min(160, Math.max(0, Math.round(T.particleCount)))
            : 0;
          while (A.length < n) A.push(particle());
          if (A.length > n) A.length = n;
          // Los cambios de apariencia no reinician posiciones ni velocidades.
        }
        function draw(s) {
          const r = s.r;
          x.save();
          x.translate(s.x, s.y);
          x.rotate(s.rot);
          x.fillStyle = s.color;
          x.strokeStyle = s.color;
          x.globalAlpha = (s.opacity * T.particleOpacity) / 100;
          x.beginPath();
          if (s.shape === "circle") {
            x.arc(0, 0, r * 0.6, 0, Math.PI * 2);
            x.fill();
          } else if (s.shape === "star") {
            for (let j = 0; j < 10; j++) {
              const a = -Math.PI / 2 + (j * Math.PI) / 5,
                rr = j % 2 ? r * 0.42 : r;
              x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
            }
            x.closePath();
            x.fill();
          } else if (s.shape === "sparkle") {
            x.moveTo(0, -r);
            x.quadraticCurveTo(r * 0.13, -r * 0.13, r, 0);
            x.quadraticCurveTo(r * 0.13, r * 0.13, 0, r);
            x.quadraticCurveTo(-r * 0.13, r * 0.13, -r, 0);
            x.quadraticCurveTo(-r * 0.13, -r * 0.13, 0, -r);
            x.fill();
          } else {
            x.moveTo(0, r * 0.85);
            x.bezierCurveTo(-r * 1.3, r * 0.1, -r, -r, 0, -r * 0.35);
            x.bezierCurveTo(r, -r, r * 1.3, r * 0.1, 0, r * 0.85);
            x.fill();
          }
          x.restore();
        }
        function frame(t) {
          raf = 0;
          // Tiempo real entre cuadros, limitado para evitar saltos tras cambiar de pestaña.
          const dt = last ? Math.min(40, Math.max(0, t - last)) : 16.67;
          last = t;
          x.clearRect(0, 0, W, H);
          if (T.particles) {
            const moving =
              !rm.matches && T.particleDrift && T.particleSpeed > 0;
            const step =
              (dt / 16.67) * Math.min(1.5, Math.max(0, T.particleSpeed / 100));
            for (const s of A) {
              if (moving) {
                s.x += s.dx * step;
                s.y += s.dy * step;
                s.rot += s.vr * step;
                if (s.x < -s.r) s.x = W + s.r;
                else if (s.x > W + s.r) s.x = -s.r;
                if (s.y < -s.r) s.y = H + s.r;
                else if (s.y > H + s.r) s.y = -s.r;
              }
              draw(s);
            }
          }
          if (!document.hidden) raf = requestAnimationFrame(frame);
        }
        function start() {
          if (document.hidden || raf) return;
          last = 0;
          raf = requestAnimationFrame(frame);
        }
        function onTheme() {
          sync();
          start();
        }
        size();
        sync();
        start();
        addEventListener("dc-theme", onTheme);
        addEventListener("resize", () => {
          size();
          start();
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            if (raf) cancelAnimationFrame(raf);
            raf = 0;
            last = 0;
          } else start();
        });
        rm.addEventListener?.("change", start);
      })();
      /* ===== Inicio ===== */
      (async () => {
        loadTheme();
        load();
        try {
          await cargarAparienciaPublica();
        } catch (e) {
          console.warn(e);
          toast("No se pudo cargar la apariencia compartida.", 1);
        }
        try {
          await imgStore.open();
        } catch (e) {
          toast("IndexedDB no disponible: las fotos no se guardarán.", 1);
          imgStore.get =
            imgStore.put =
            imgStore.del =
            imgStore.clear =
              async () => null;
        }
        await loadCustomFont();
        try {
          await cargarImagenesPublicas();
        } catch (e) {
          console.warn(e);
          toast(
            "No se pudieron cargar las imágenes. Inténtalo de nuevo.",
            1,
          );
        }
        await setLogo();
        await cargarCategoriasSupabase();
        await sincronizarCajasSupabase();
        try {
          await sincronizarProductosSupabase();
        } catch (e) {
          console.warn(e);
          toast(
            "No se pudieron cargar los productos públicos: " + e.message,
            1,
          );
        }
        try {
          await sincronizarCargosPublicados();
        } catch (e) {
          console.warn(e);
          toast(e.message, 1);
        }
        try {
          await sincronizarEnviosSupabase();
        } catch (e) {
          console.warn(e);
          D.envios = [];
          toast("No se pudieron cargar los envíos públicos: " + e.message, 1);
        }
        S.fromNav = 0;
        await route();
      })();
    </script>
  </body>
